name: mcp-release

# Publishes the MCP server (mcp/) to npm as @basis1/mcp. Mirrors
# sdk-release.yml; nothing here runs by accident:
#
#   - It triggers only on a pushed tag `mcp-v<version>` or a manual dispatch,
#     and a manual dispatch is a dry run unless `dry_run` is unticked AND it
#     was started from an `mcp-v*` tag.
#   - The tag must equal mcp/package.json's version, and mcp/server.json must
#     carry the same version.
#   - The full mcp-ci workflow (tests, stdio handshake, pack smoke on Node
#     20.19/22/24 and Windows) runs first.
#   - The @basis1/parse dependency (file:../sdk in the repository) is pinned
#     to ^<sdk version>, and that version must already be on npm: when both
#     packages change, release sdk-v<version> first.
#   - mcp/scripts/check-publishable.mjs refuses a package with a local
#     dependency path, a non-Apache license, or a mismatched server.json.
#   - The publish job runs in the `npm-publish` environment. Add required
#     reviewers to it (Settings -> Environments) so a person approves each
#     release.
#
# Credentials, in order of preference:
#   1. npm trusted publishing (OIDC): configure this repository and workflow
#      file (mcp-release.yml) as a trusted publisher in @basis1/mcp's npm
#      settings. No secret. Needs npm >= 11.5.1, installed below.
#   2. An `NPM_TOKEN` secret on the `npm-publish` environment: a granular
#      access token limited to @basis1/mcp. Needed for the very first
#      publish, since npm only offers trusted publishing for a package that
#      already exists. Delete it once trusted publishing is set up.
#
# Provenance (`--provenance`) is added only when the repository is public:
# npm can't attest builds from a private repository.
#
# After the npm publish, the `registry` job lists server.json in the MCP
# Registry as tech.basis1/mcp. The registry verifies the tech.basis1
# namespace through a DNS TXT record on basis1.tech, so the job signs in with
# the matching Ed25519 private key: an `MCP_REGISTRY_KEY` secret (hex) on the
# `npm-publish` environment. server.json is validated against the registry
# before the npm publish, in dry runs too. The registry job is separate so a
# failed listing can be re-run without re-publishing to npm. See
# mcp/README.md.

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, test and show what would be published, without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mcp-release
  cancel-in-progress: false

env:
  # github.com/modelcontextprotocol/registry releases; the checksum is from
  # that release's registry_<version>_checksums.txt.
  MCP_PUBLISHER_VERSION: v1.8.7
  MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579

jobs:
  test:
    if: github.repository == 'basis1tech/basis-oss'
    uses: ./.github/workflows/mcp-ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Decide whether this run publishes
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          publish=false
          if [ "$EVENT" = "push" ]; then
            publish=true
          elif [ "$DRY_RUN_INPUT" = "false" ]; then
            case "$REF" in
              refs/tags/mcp-v*) publish=true ;;
              *) echo "::error::A real publish must be dispatched from an mcp-v* tag, not $REF"; exit 1 ;;
            esac
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publishing: $publish"

      - name: Check the tag matches package.json and server.json
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./server.json').version")
          if [ "$TAG" != "mcp-v$version" ]; then
            echo "::error::Tag $TAG doesn't match mcp/package.json version $version (expected mcp-v$version)"
            exit 1
          fi
          if [ "$manifest" != "$version" ]; then
            echo "::error::mcp/server.json version $manifest doesn't match package.json $version"
            exit 1
          fi

      # npm ci links file:../sdk, so the SDK has to be installed and built
      # beside it: its types resolve from sdk/dist.
      - name: Install
        run: (cd ../sdk && npm ci && npm run build) && npm ci

      - name: Pin @basis1/parse to a registry version
        run: node scripts/sdk-dependency.mjs pin

      - name: Check the pinned @basis1/parse is on npm
        id: sdk
        run: |
          spec=$(node -p "require('./package.json').dependencies['@basis1/parse']")
          if found=$(npm view "@basis1/parse@$spec" version --json 2>/dev/null) && [ -n "$found" ]; then
            echo "@basis1/parse@$spec resolves to: $found"
          elif [ "${{ steps.mode.outputs.publish }}" = "true" ]; then
            echo "::error::@basis1/parse@$spec isn't on npm. Release the SDK first (push an sdk-v* tag), then re-run this release."
            exit 1
          else
            echo "::warning::@basis1/parse@$spec isn't on npm yet; a real publish would stop here. Release the SDK first."
          fi

      - run: npm run build

      - name: Show the tarball contents
        run: npm pack --dry-run

      - name: Check the package is publishable
        if: steps.mode.outputs.publish == 'true'
        run: node scripts/check-publishable.mjs

      - name: Report publishability (dry run only)
        if: steps.mode.outputs.publish != 'true'
        run: node scripts/check-publishable.mjs || echo "::warning::Not publishable yet; see the messages above"

      - name: Install mcp-publisher
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate server.json against the MCP Registry
        run: mcp-publisher validate

      - name: Publish
        if: steps.mode.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          flags="--access public"
          if [ "$PRIVATE_REPO" = "false" ]; then flags="$flags --provenance"; fi
          # prepack rebuilds dist; prepublishOnly re-runs the publishability check.
          npm publish $flags

      # npm refuses an already-published version even with --dry-run, and
      # main sits at the released version between releases.
      - name: Publish (dry run)
        if: steps.mode.outputs.publish != 'true'
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "::notice::$spec is already on npm, so there's nothing new to dry-run publish. Bump the version to rehearse the next release."
            exit 0
          fi
          npm publish --dry-run --ignore-scripts --access public

  registry:
    needs: publish
    if: needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The registry checks that the npm version exists and carries mcpName,
      # and a fresh npm publish can take a few minutes to appear.
      - name: Wait for the npm version
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          for _ in $(seq 1 30); do
            # npm view answers empty, not an error, for a missing version.
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then echo "$spec is on npm"; exit 0; fi
            sleep 20
          done
          echo "::error::$spec didn't appear on npm within 10 minutes; re-run this job once it does"
          exit 1

      - name: Sign in to the MCP Registry
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_KEY" ]; then
            echo "::error::The MCP_REGISTRY_KEY secret isn't set on the npm-publish environment"
            exit 1
          fi
          mcp-publisher login dns --domain basis1.tech --private-key "$MCP_REGISTRY_KEY"

      - name: Publish server.json
        run: mcp-publisher publish
