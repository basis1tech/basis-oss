name: sdk-ci

# Tests for the TypeScript SDK (sdk/). Its consumer in this repository, mcp/,
# has its own workflow (mcp-ci.yml), which also runs when sdk/ changes.

on:
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
      - ".github/workflows/sdk-release.yml"
  push:
    branches: [main]
    paths:
      - "sdk/**"
  workflow_call: {}

permissions:
  contents: read

jobs:
  sdk:
    name: sdk (unit, pack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - name: Typecheck and test
        run: npm test

      - name: Pack, install into a fresh project, import from ESM, CJS and TypeScript
        run: npm run test:pack

  sdk-node-compat:
    name: sdk install smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines.node is >=20.19.0; 24 is covered by the job above.
        node: ["20.19", "22"]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run test:pack
