name: mcp-ci

# Tests for the MCP server package (mcp/, published as @basis1/mcp). Runs on
# PRs that touch it, the SDK it depends on (sdk/) or the Dockerfile, and on
# every push to main so the head commit always carries a CI status (directory
# listings such as Glama read it).

on:
  pull_request:
    paths:
      - "sdk/**"
      - "mcp/**"
      - ".github/workflows/mcp-ci.yml"
      - ".github/workflows/mcp-release.yml"
      - "Dockerfile"
      - ".dockerignore"
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  mcp:
    name: mcp (typecheck, tests, stdio handshake, pack smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the SDK (linked as file:../sdk)
        working-directory: sdk
        run: npm ci && npm run build

      - name: Install
        working-directory: mcp
        run: npm ci

      - name: Typecheck and bundle
        working-directory: mcp
        run: npm run build

      - name: Tests (unit, hosted forwarding, stdio handshake)
        working-directory: mcp
        run: npm test

      - name: Pack, install into a fresh project, MCP handshake through the bin and npx
        working-directory: mcp
        run: npm run test:pack

  mcp-node-compat:
    name: mcp install smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines.node is >=20.19.0; 24 is covered by the job above.
        node: ["20.19", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the SDK and mcp
        run: (cd sdk && npm ci) && (cd mcp && npm ci)
      - name: Pack, install, MCP handshake
        working-directory: mcp
        run: npm run test:pack

  mcp-windows:
    name: mcp install smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the SDK and mcp
        shell: bash
        run: (cd sdk && npm ci) && (cd mcp && npm ci)
      - name: Pack, install, MCP handshake
        working-directory: mcp
        run: npm run test:pack

  docker:
    name: docker image (build, tools/list without a key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t basis1-mcp .
      - name: Starts without BASIS_API_KEY and lists its tools
        run: |
          out=$( { printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 5; } | docker run -i --rm basis1-mcp )
          count=$(printf '%s\n' "$out" | jq -s 'map(select(.id == 2)) | .[0].result.tools | length')
          echo "tools/list returned $count tools"
          test "$count" -gt 0
