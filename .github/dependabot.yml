# Weekly dependency updates, one grouped PR per package so they stay easy to
# review. Security updates are enabled separately in the repository settings
# and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /sdk
    schedule:
      interval: weekly
    groups:
      sdk:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    groups:
      mcp:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
