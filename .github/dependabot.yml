# Weekly dependency updates. Minor and patch updates arrive as one grouped PR
# per package; a major version gets its own PR, since it usually needs code
# changes. Security updates are enabled in the repository settings and arrive
# as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /sdk
    schedule:
      interval: weekly
    groups:
      sdk:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    groups:
      mcp:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  # The Dockerfile's Node base image. Majors are moved by hand from one LTS
  # release to the next (22, 24, ...); odd-numbered releases are short-lived.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
